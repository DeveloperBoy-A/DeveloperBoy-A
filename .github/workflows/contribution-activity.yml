name: Update Contribution Activity

on:
  schedule:
    - cron: "17 */6 * * *"

  workflow_dispatch:

  push:
    paths-ignore:
      - "README.md"
      - ".github/workflows/contribution-activity.yml"

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Profile Repository
        uses: actions/checkout@v4

      - name: Update Contribution Activity
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const fs = require("fs");

            const username = "DeveloperBoy-A";
            const readmePath = "README.md";

            const repos = [
              "AutoDelete_Bot",
              "Auto_Filter_Bot",
              "Tokyo-Updates-MiniApp",
              "IMDBKit",
              "Tokyo-PrincessBot"
            ];

            const startMarker =
              "<!-- CONTRIBUTION-ACTIVITY:START -->";

            const endMarker =
              "<!-- CONTRIBUTION-ACTIVITY:END -->";

            // Current time and day boundaries in India (IST).
            const now = new Date();

            const istNow = new Date(
              now.getTime() + (330 * 60 * 1000)
            );

            const todayStart = new Date(
              Date.UTC(
                istNow.getUTCFullYear(),
                istNow.getUTCMonth(),
                istNow.getUTCDate()
              ) - (330 * 60 * 1000)
            );

            const todayEnd = now;

            const yesterdayEnd = new Date(
              todayStart.getTime() - 1000
            );

            const yearStart = new Date(
              todayStart.getTime()
            );

            yearStart.setUTCDate(
              yearStart.getUTCDate() - 365
            );

            const todayLabel = istNow.toLocaleDateString(
              "en-IN",
              {
                day: "2-digit",
                month: "long",
                year: "numeric",
                timeZone: "UTC"
              }
            );

            // Count actual commits attributed to the GitHub account.
            async function countCommits(repo, since, until) {
              let page = 1;
              let total = 0;

              while (true) {
                const url = new URL(
                  `https://api.github.com/repos/${username}/${repo}/commits`
                );

                url.searchParams.set("author", username);
                url.searchParams.set(
                  "since",
                  since.toISOString()
                );
                url.searchParams.set(
                  "until",
                  until.toISOString()
                );
                url.searchParams.set("per_page", "100");
                url.searchParams.set("page", String(page));

                const response = await fetch(url, {
                  headers: {
                    "Accept": "application/vnd.github+json",
                    "Authorization":
                      `Bearer ${process.env.GITHUB_TOKEN}`,
                    "X-GitHub-Api-Version": "2022-11-28",
                    "User-Agent":
                      "Tokyo-Updates-Contribution-Activity"
                  }
                });

                if (!response.ok) {
                  throw new Error(
                    `Commit API failed for ${repo}: ` +
                    `${response.status} ${await response.text()}`
                  );
                }

                const commits = await response.json();

                total += commits.length;

                if (commits.length < 100) {
                  break;
                }

                page += 1;
              }

              return total;
            }

            // Collect each project's previous-365-day and today's counts.
            const stats = [];

            for (const repo of repos) {
              const repoUrl =
                `https://github.com/${username}/${repo}`;

              const [last365, today] = await Promise.all([
                countCommits(
                  repo,
                  yearStart,
                  yesterdayEnd
                ),
                countCommits(
                  repo,
                  todayStart,
                  todayEnd
                )
              ]);

              stats.push({
                repo,
                repoUrl,
                last365,
                today
              });
            }

            const totalLast365 = stats.reduce(
              (sum, item) => sum + item.last365,
              0
            );

            const totalToday = stats.reduce(
              (sum, item) => sum + item.today,
              0
            );

            // Keep project names bold using HTML, which works inside tables.
            const rows = stats.map(item => [
              "<tr>",
              "<td>",
              `📦 <strong><a href="${item.repoUrl}">${item.repo}</a></strong>`,
              "<br/><br/>",
              `🗓️ Previous 365 days: <strong>${item.last365}</strong> commits`,
              "<br/>",
              `⚡ Today (${todayLabel} IST): <strong>${item.today}</strong> commits`,
              "<br/><br/>",
              `<a href="${item.repoUrl}/commits?author=${username}">`,
              "🔗 View Commits",
              "</a>",
              "</td>",
              "</tr>"
            ].join("\n")).join("\n");

            const generated = [
              startMarker,
              "### 🗓️ **𝐑ᴇᴄᴇɴᴛ 𝐂ᴏɴᴛʀɪʙᴜᴛɪᴏɴ 𝐀ᴄᴛɪᴠɪᴛʏ**",
              "",
              '<p align="center"><strong>⚡ Automatically updated by GitHub Actions</strong></p>',
              "",
              "<table>",
              "<tr>",
              '<td align="center">',
              "<strong>📊 ALL PROJECTS TOTAL</strong>",
              "<br/><br/>",
              `🗓️ Previous 365 days: <strong>${totalLast365}</strong> commits`,
              "<br/>",
              `⚡ Today (${todayLabel} IST): <strong>${totalToday}</strong> commits`,
              "</td>",
              "</tr>",
              rows,
              "</table>",
              "",
              "<sub>Counts are fetched from GitHub's commit API. " +
              "Today's commits are displayed separately from the previous " +
              "365 days. Only commits attributed by GitHub to this account " +
              "in the listed repositories are counted.</sub>",
              endMarker
            ].join("\n");

            let readme = fs.readFileSync(
              readmePath,
              "utf8"
            );

            const start = readme.indexOf(startMarker);
            const end = readme.indexOf(endMarker);

            if (
              start === -1 ||
              end === -1 ||
              end < start
            ) {
              throw new Error(
                "Contribution activity markers are missing from README.md"
              );
            }

            const updated =
              readme.slice(0, start) +
              generated +
              readme.slice(end + endMarker.length);

            if (updated === readme) {
              core.info(
                "Contribution activity is already up to date."
              );
              return;
            }

            const { data: file } =
              await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: readmePath
              });

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: readmePath,
              message:
                "fix: show accurate yearly and daily commit counts",
              content: Buffer.from(updated).toString("base64"),
              sha: file.sha
            });

            core.info(
              "Contribution activity updated successfully."
            );
