name: Update Contribution Activity

on:
  schedule:
    - cron: "17 */6 * * *"

  workflow_dispatch:

  push:
    paths-ignore:
      - "README.md"
      - ".github/workflows/contribution-activity.yml"

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Profile Repository
        uses: actions/checkout@v4

      - name: Update Contribution Activity
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const username = "DeveloperBoy-A";
            const readmePath = "README.md";

            const startMarker =
              "<!-- CONTRIBUTION-ACTIVITY:START -->";

            const endMarker =
              "<!-- CONTRIBUTION-ACTIVITY:END -->";

            const response = await fetch(
              `https://api.github.com/users/${username}/events/public?per_page=100`,
              {
                headers: {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "Tokyo-Updates-Contribution-Activity"
                }
              }
            );

            if (!response.ok) {
              throw new Error(
                `GitHub Events API failed: ${response.status}`
              );
            }

            const events = await response.json();

            const pushes = events.filter(
              event =>
                event.type === "PushEvent" &&
                event.repo &&
                event.repo.name
            );

            const groups = new Map();

            for (const event of pushes) {
              const date = new Date(event.created_at);

              const month = date.toLocaleDateString(
                "en-US",
                {
                  month: "long",
                  year: "numeric",
                  timeZone: "UTC"
                }
              );

              const repo = event.repo.name;

              const key = `${month}|||${repo}`;

              if (!groups.has(key)) {
                groups.set(key, {
                  month,
                  repo,
                  commits: 0,
                  latest: event.created_at
                });
              }

              const item = groups.get(key);

              const count =
                Number(event.payload?.size) ||
                event.payload?.commits?.length ||
                0;

              item.commits += count;

              if (event.created_at > item.latest) {
                item.latest = event.created_at;
              }
            }

            const rows = [...groups.values()]
              .sort(
                (a, b) =>
                  new Date(b.latest) - new Date(a.latest)
              )
              .slice(0, 12);

            let activity;

            if (rows.length === 0) {
              activity = [
                '<tr><td align="center">',
                '**No recent public push activity found.**',
                '<br/>Private activity may not appear here.',
                '</td></tr>'
              ].join("\n");
            } else {
              activity = rows.map(item => {
                const parts = item.repo.split("/");
                const owner = parts[0];
                const repoName = parts[1];

                const repoUrl =
                  `https://github.com/${item.repo}`;

                const commitsUrl =
                  `${repoUrl}/commits?author=${username}`;

                const count = item.commits;

                return [
                  '<tr>',
                  '<td>',
                  `### 📦 [**${repoName}**](${repoUrl})`,
                  '',
                  `📅 **${item.month}**`,
                  '',
                  `🔢 [${count} commits](${commitsUrl})`,
                  '',
                  `👤 [${owner}](${`https://github.com/${owner}`})`,
                  '</td>',
                  '</tr>'
                ].join("\n");
              }).join("\n");
            }

            const generated = [
              startMarker,
              "### 🗓️ **RECENT CONTRIBUTION ACTIVITY**",
              "",
              '<table>',
              '<tr><td align="center">',
              '**⚡ Automatically updated by GitHub Actions**',
              '</td></tr>',
              activity,
              '</table>',
              "",
              "<sub>Based on recent public GitHub push events. " +
              "This is not a complete historical contribution count.</sub>",
              endMarker
            ].join("\n");

            let readme = fs.readFileSync(
              readmePath,
              "utf8"
            );

            const start = readme.indexOf(startMarker);
            const end = readme.indexOf(endMarker);

            if (start === -1 || end === -1 || end < start) {
              throw new Error(
                "Contribution activity markers are missing from README.md"
              );
            }

            const endPosition = end + endMarker.length;

            const updated =
              readme.slice(0, start) +
              generated +
              readme.slice(endPosition);

            if (updated === readme) {
              core.info("Contribution activity is already up to date.");
              return;
            }

            const { data: file } =
              await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: readmePath
              });

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: readmePath,
              message: "chore: update contribution activity",
              content: Buffer.from(updated).toString("base64"),
              sha: file.sha
            });

            core.info("Contribution activity updated successfully.");
